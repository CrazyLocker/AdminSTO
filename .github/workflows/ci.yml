name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build --console=plain

      # build уже проверяет пороги покрытия (check зависит от
      # jacocoTestCoverageVerification), а сам отчёт строится отдельно.
      - name: Coverage report (JaCoCo)
        run: ./gradlew jacocoTestReport --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/reports/jacoco
          retention-days: 7

  ui-test:
    name: JavaFX UI tests (headless)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # UI-тесты идут с Monocle Headless (чистая Java), но Xvfb страхует
      # загрузку нативных библиотек JavaFX на образе без X-сервера.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run JavaFX UI tests
        run: xvfb-run -a ./gradlew uiTest --console=plain

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: |
            build/reports/tests/uiTest
            build/test-results/uiTest
          retention-days: 7

  # Мутационное тестирование: прогон долгий (единицы минут и больше), поэтому
  # запускается вручную — Actions → CI → Run workflow, либо локально
  # `./gradlew pitest`. В обычную сборку не входит намеренно.
  mutation:
    name: Mutation testing (PIT, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run mutation analysis
        run: ./gradlew pitest --console=plain

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: build/reports/pitest
          retention-days: 14
